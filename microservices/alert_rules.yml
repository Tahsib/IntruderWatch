groups:
  - name: intruder_watch_alerts
    rules:
      # --- SECURITY & AVAILABILITY (Topic: intruder-alerts) ---
      - alert: ServiceDown
        expr: up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is DOWN"

      # --- HARDWARE MONITORING (Topic: hardware-alerts) ---
      - alert: GPUTempHigh
        expr: max by (instance, gpu_id) (avg_over_time(gpu_junction_temperature[5m])) > 75
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GPU Temp: {{ $value | printf \"%.1f\" }}°C"

      - alert: GPUPowerHigh
        expr: max by (instance, gpu_id) (avg_over_time(gpu_average_package_power[5m])) > 150
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GPU Power: {{ $value | printf \"%.0f\" }}W"

      # --- INFRASTRUCTURE & HOST (Topic: infra-alerts) ---
      - alert: RabbitMQBacklog
        expr: sum by (queue) (rabbitmq_queue_messages_ready) > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Queue {{ $labels.queue }} Lag: {{ $value }} msgs"

      - alert: HostHighCPU
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 70
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU Usage: {{ $value | printf \"%.0f\" }}%"

      - alert: ContainerCPUThrottling
        expr: (rate(container_cpu_cfs_throttled_periods_total{name=~".+"}[5m]) / rate(container_cpu_cfs_periods_total{name=~".+"}[5m])) * 100 > 25
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} is CPU throttled: {{ $value | printf \"%.0f\" }}%"

      - alert: HostLowDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk Space: {{ $value | printf \"%.0f\" }}% left"

      - alert: CaptureErrors
        expr: increase(frame_capturer_errors_total[5m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Cam {{ $labels.camera_id }} errors: {{ $value | printf \"%.0f\" }}"

      - alert: DetectorErrors
        expr: increase(human_detector_errors_total[5m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AI Detector errors: {{ $value | printf \"%.0f\" }}"
