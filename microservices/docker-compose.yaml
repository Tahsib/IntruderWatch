# IntruderWatch Microservices
# ============================
---
x-frame-capturer: &frame-capturer
  build:
    context: .
    dockerfile: frame_capturer/Dockerfile
  image: microservices_frame_capturer:latest
  env_file:
    - .env
  environment: &frame-capturer-env
    SUBTYPE: 0
    FRAME_WIDTH: 1920
    FRAME_HEIGHT: 1080
    FPS: 4
    LOG_LEVEL: INFO
    JPEG_QUALITY: 85
    FRAME_SLEEP: 0.05
  restart: unless-stopped
  expose:
    - "8001"
  depends_on:
    rabbitmq:
      condition: service_healthy
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 512M
  networks:
    - detection

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    tmpfs:
      - /var/lib/rabbitmq:rw,noexec,nosuid,size=2g
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - detection

  # Camera Profiles (All standardized to 1920x1080 for inference consistency)
  frame_capturer_1:
    <<: *frame-capturer
    container_name: frame_capturer_1
    environment: { <<: *frame-capturer-env, CHANNEL: 1 }
    profiles: [cam1]

  frame_capturer_2:
    <<: *frame-capturer
    container_name: frame_capturer_2
    environment: { <<: *frame-capturer-env, CHANNEL: 2 }
    profiles: [cam2]

  frame_capturer_3:
    <<: *frame-capturer
    container_name: frame_capturer_3
    environment: { <<: *frame-capturer-env, CHANNEL: 3 }
    profiles: [cam3]

  frame_capturer_4:
    <<: *frame-capturer
    container_name: frame_capturer_4
    environment: { <<: *frame-capturer-env, CHANNEL: 4 }
    profiles: [cam4]

  frame_capturer_5:
    <<: *frame-capturer
    container_name: frame_capturer_5
    environment: { <<: *frame-capturer-env, CHANNEL: 5 }
    profiles: [cam5]

  frame_capturer_6:
    <<: *frame-capturer
    container_name: frame_capturer_6
    environment: { <<: *frame-capturer-env, CHANNEL: 6 }
    profiles: [cam6]

  frame_capturer_7:
    <<: *frame-capturer
    container_name: frame_capturer_7
    environment: { <<: *frame-capturer-env, CHANNEL: 7 }
    profiles: [cam7]

  frame_capturer_8:
    <<: *frame-capturer
    container_name: frame_capturer_8
    environment: { <<: *frame-capturer-env, CHANNEL: 8 }
    profiles: [cam8]

  human_detector:
    build:
      context: .
      dockerfile: human_detector/Dockerfile
    image: microservices_human_detector:latest
    env_file:
      - .env
    environment:
      LOG_LEVEL: INFO
      INFERENCE_SIZE: 1280
      DETECTION_CONFIDENCE: 0.8
      HSA_OVERRIDE_GFX_VERSION: "10.3.0"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      TRITON_CACHE_DIR: "/tmp/triton"
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    security_opt:
      - seccomp:unconfined
    group_add:
      - video
    volumes:
      - ./captures:/app/captures
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "2.0"
          memory: 6G
    networks:
      - detection

  alert_service:
    build:
      context: .
      dockerfile: alert_service/Dockerfile
    container_name: alert_service
    env_file:
      - .env
    environment:
      NTFY_BASE_URL: ${NTFY_BASE_URL:-http://localhost:8081}
      VIEWER_BASE_URL: ${VIEWER_BASE_URL:-http://localhost:8085}
      ALERT_BYPASS_TOKEN: ${ALERT_BYPASS_TOKEN}
    volumes:
      - ./captures:/app/captures:ro
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M
    networks:
      - detection

  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    command:
      - serve
    environment:
      - NTFY_BASE_URL=${NTFY_BASE_URL:-http://localhost:8081}
      - NTFY_ATTACHMENT_CACHE_DIR=/var/cache/ntfy/attachments
      - NTFY_ATTACHMENT_TOTAL_SIZE_LIMIT=1G
      - NTFY_ATTACHMENT_FILE_SIZE_LIMIT=10M
      - NTFY_ATTACHMENT_EXPIRY_DURATION=24h
    volumes:
      - ntfy-data:/var/cache/ntfy
    ports:
      - "8081:80"
    restart: unless-stopped
    networks:
      - detection

  viewer_service:
    build:
      context: .
      dockerfile: viewer_service/Dockerfile
    container_name: viewer_service
    env_file:
      - .env
    volumes:
      - ./captures:/app/captures:ro
    ports:
      - "8085:8080"
    environment:
      VIEWER_USERNAME: ${VIEWER_USERNAME:-admin}
      VIEWER_PASSWORD: ${VIEWER_PASSWORD:-password123}
      ALERT_BYPASS_TOKEN: ${ALERT_BYPASS_TOKEN}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 128M
    networks:
      - detection

  amd_gpu_exporter:
    image: rocm/device-metrics-exporter:v1.4.2
    container_name: amd_gpu_exporter
    ports:
      - "9835:5000"
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    security_opt:
      - seccomp:unconfined
    group_add:
      - video
    restart: unless-stopped
    networks:
      - detection

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    environment:
      - DOCKER_API_VERSION=1.45
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - '--docker_only=true'
      - '--housekeeping_interval=10s'
    restart: unless-stopped
    networks:
      - detection

  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped
    networks:
      - detection

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - detection

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    restart: unless-stopped
    networks:
      - detection

  loki:
    image: grafana/loki:2.9.10
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    networks:
      - detection

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    networks:
      - detection

networks:
  detection:
    driver: bridge

volumes:
  loki-data:
  prometheus-data:
  grafana-data:
  ntfy-data:
