name: Lint and Validate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: 🐍 Python Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: pip install ruff
      - name: Run Ruff
        run: ruff check .

  validate-infra:
    name: 🐳 Docker Infrastructure Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Dummy .env
        run: |
          cd microservices
          # Create a dummy .env to satisfy docker-compose validation
          cp .env.example .env
      - name: Validate Docker Compose Syntax
        run: |
          cd microservices
          # Verifies docker-compose.yaml structure, indentation, and variable interpolation
          docker compose config --quiet
      - name: Verify Dockerfile Existence
        run: |
          # Ensures all referenced Dockerfiles exist in the repository
          test -f microservices/frame_capturer/Dockerfile
          test -f microservices/human_detector/Dockerfile
          test -f microservices/alert_service/Dockerfile
          test -f microservices/viewer_service/Dockerfile
